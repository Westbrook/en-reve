<h1>Portable rich editing</h1><p>Select text to capture a revision-bound range. Decorate it, replace it, then undo. Type <code>/insert t</code> to match a known multiword command. Copy a reference token between the editors to import it with a fresh occurrence ID.</p>
<en-rich-text-editor label="Document"></en-rich-text-editor>
<p><button id="capture">Capture selection</button><button id="decorate">Decorate captured range</button><button id="replace">Replace with “Revised”</button><button id="undo">Undo</button><button id="reset">Reset document</button></p>
<en-token-editor label="Token destination"></en-token-editor><pre id="receipt" aria-live="polite"></pre></body></html>
