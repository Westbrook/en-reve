<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choice element interaction fixture</title>
<script type="module" src="./choice-fixture.mjs"></script>
<form id="choices">
  <fieldset id="controls">
    <legend>Export settings</legend>
    <en-checkbox name="notifications" value="yes">Notify collaborators</en-checkbox>
    <en-switch name="preview" checked>Live preview</en-switch>
    <en-radio-group name="format" label="Export format" value="png">
      <en-radio value="png">PNG</en-radio>
      <en-radio value="jpeg" disabled>JPEG</en-radio>
      <en-radio value="svg">SVG</en-radio>
    </en-radio-group>
    <en-slider name="opacity" label="Opacity" min="0.1" max="0.9" step="0.1" value="0.2" show-value></en-slider>
    <en-rating name="quality" label="Quality" value="3"></en-rating>
    <label>Before appearance <input id="before-segmented"></label>
    <en-segmented-control name="appearance" label="Appearance" value="light"></en-segmented-control>
    <label>After appearance <input id="after-segmented"></label>
  </fieldset>
  <button type="reset">Reset settings</button>
  <button type="button" id="after">After settings</button>
</form>
</html>
