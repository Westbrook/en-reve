<!doctype html><html lang="en"><meta charset="utf-8"><title>Context Protocol integration</title>
<style>body{font:16px system-ui;margin:2rem}en-carousel{display:block;width:500px}en-carousel-slide{min-height:100px}en-editor-toolbar{display:block}</style>
<body><main id="fixture"></main><script type="module">
import {LitElement, html} from 'lit';
import {ContextProvider, createContext, ContextRoot, ContextConsumer} from '@lit/context';
import {editorExtensionContext,richEditorCommandContext,editorMessagesContext,colorMessagesContext,carouselContext} from '@en-reve/elements/context.js';
import {ScopedContext} from '/packages/elements/src/internal/context-consumer.ts';
import {EnEditorToolbar} from '@en-reve/elements/editor-toolbar.js';
import {EnEditorTrigger} from '@en-reve/elements/editor-trigger.js';
import {ContextProvider as ProtocolProvider} from '@en-reve/elements/context.js';
import '@en-reve/elements/define/editor-toolbar.js';
import '@en-reve/elements/define/editor-trigger.js';
import '@en-reve/elements/define/rich-text-editor.js';
import '@en-reve/elements/define/token-editor.js';
import '@en-reve/elements/define/carousel.js';
import '@en-reve/elements/define/color-picker.js';
class Scope extends LitElement { render(){return html`<slot></slot>`;} }
customElements.define('test-scope',Scope);
class CommandHost extends HTMLElement {
  revision=0;selectionKey='a';hasSelection=false;disabled=false;readOnly=false;composing=false;extensionOpen=false;
  calls=[];active=0;registrations=0;
  captureBookmark(){return {revision:0};} restoreBookmark(){return true;}
  execute(command){this.calls.push(command);return true;}
  getCommandState(){return {enabled:true,active:false,mixed:false};} getSelectionRect(){return undefined;}
  registerExtension(){this.active++;this.registrations++;return()=>this.active--;}
}
customElements.define('test-editor',CommandHost);
window.api={LitElement,html,ContextProvider,ProtocolProvider,ContextConsumer,ContextRoot,createContext,ScopedContext,Scope,CommandHost,EnEditorToolbar,EnEditorTrigger,editorExtensionContext,richEditorCommandContext,editorMessagesContext,colorMessagesContext,carouselContext};
window.ready=true;
</script></body></html>
